name: kabuk
description: "Agent-centric personal OS shell"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database
  drift: ^2.25.0
  sqlite3_flutter_libs: ^0.5.30

  # Data classes
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Remote Flutter Widgets
  rfw: ^1.0.31

  # Utilities
  uuid: ^4.5.1
  collection: ^1.19.1
  meta: ^1.16.0

  # Crypto
  cryptography: ^2.7.0
  pointycastle: ^3.9.1
  bech32: ^0.2.2
  convert: ^3.1.1

  # HTTP (for LLM providers)
  http: ^1.3.0

  # Local LLM inference (llama.cpp via Dart Native Assets)
  llamadart: ^0.6.3

  # WebSocket (for Nostr relays)
  web_socket_channel: ^3.0.2

  # URL opening
  url_launcher: ^6.3.1

  # In-app web preview
  webview_flutter: ^4.10.0

  # Image loading & caching
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

  # Video playback
  video_player: ^2.9.3

  # Markdown rendering
  flutter_markdown: ^0.7.6
  drift_flutter: ^0.2.7
  image_picker: ^1.2.1
  record: ^6.2.0
  path_provider: ^2.1.5
  xml: ^6.6.1
  camera: ^0.12.0
  file_picker: ^9.2.1

  # Biometric authentication
  local_auth: ^2.3.0

  # Platform notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Connectivity checking
  connectivity_plus: ^6.1.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0

  # Background task scheduling (OS-level periodic refresh)
  workmanager: ^0.9.0
  youtube_explode_dart: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  drift_dev: ^2.25.0

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
